name: Export goal rows

on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/export-goal-rows.cjs'
      - '.github/workflows/export-goal-rows.yml'

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --ignore-scripts --no-audit --no-fund
      - name: Export goals
        run: node scripts/export-goal-rows.cjs
        env:
          DB_HOST: 37.140.199.107
          DB_PORT: '16623'
          DB_NAME: mylomonosov
          DB_USER: readonly_user
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_SSL: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: goal-rows
          path: goal-row-result/goals.json
          if-no-files-found: error
          retention-days: 1
