name: Build sanitized row report

on:
  workflow_dispatch:
    inputs:
      target_month:
        description: 'Месяц отчёта в формате YYYY-MM, например 2026-10'
        required: true
        type: string

  pull_request:
    branches: [main]
    paths:
      - 'scripts/build-sanitized-row-report.cjs'
      - '.github/workflows/build-sanitized-row-report.yml'

permissions:
  contents: read

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - run: npm install --ignore-scripts --no-audit --no-fund

      - name: Build sanitized report rows
        run: node scripts/build-sanitized-row-report.cjs
        env:
          TARGET_MONTH: ${{ inputs.target_month || '2026-09' }}

          DB_HOST: 37.140.199.107
          DB_PORT: '16623'
          DB_NAME: mylomonosov
          DB_USER: readonly_user
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_SSL: 'false'
